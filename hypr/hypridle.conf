
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 hyprlock
    ignore_dbus_inhibit = false
}

# Escurece a tela depois de 1 hora de inatividade
listener {
    timeout = 3600

    on-timeout = /home/onze/.config/hypr/scripts/hypridle-brightness dim
    on-resume = /home/onze/.config/hypr/scripts/hypridle-brightness restore
}

# Entra em repouso depois de 2 horas de inatividade
listener {
    timeout = 7200
    on-timeout = systemctl suspend
}
