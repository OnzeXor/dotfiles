[manager]
cwd = { fg = "#88C0D0", bold = true }

# Estilo dos itens selecionados e cursor
hovered         = { fg = "#2E3440", bg = "#88C0D0", bold = true }
preview_hovered = { underline = true }

# Itens marcados
marked = { fg = "#EBCB8B", bold = true }

# Lista de arquivos e metadados
tab_active   = { fg = "#2E3440", bg = "#81A1C1" }
tab_inactive = { fg = "#D8DEE9", bg = "#3B4252" }
border_style = { fg = "#4C566A" }

[filetype]
rules = [
  # Diretórios
  { mime = "inode/directory", fg = "#81A1C1", bold = true },

  # Arquivos compactados e binários
  { mime = "application/*zip*", fg = "#B48EAD" },
  { mime = "application/x-tar", fg = "#B48EAD" },

  # Imagens, Vídeos e Áudio
  { mime = "image/*", fg = "#A3BE8C" },
  { mime = "video/*", fg = "#EBCB8B" },
  { mime = "audio/*", fg = "#EBCB8B" },

  # Documentos e código
  { mime = "text/*", fg = "#ECEFF4" },
  { mime = "application/json", fg = "#8FBCBB" },
  { mime = "application/pdf", fg = "#D08770" },

  # Fallback geral
  { mime = "*", fg = "#ECEFF4" }
]
[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#4C566A", bg = "#4C566A" }

mode_normal = { fg = "#2E3440", bg = "#81A1C1", bold = true }
mode_select = { fg = "#2E3440", bg = "#A3BE8C", bold = true }
mode_unset  = { fg = "#2E3440", bg = "#BF616A", bold = true }

# Informações de progresso e status bar
progress_label  = { fg = "#ECEFF4", bold = true }
progress_normal = { fg = "#81A1C1", bg = "#3B4252" }
progress_error  = { fg = "#BF616A", bg = "#3B4252" }

[flavor]
dark  = "noctalia"
light = "noctalia"
